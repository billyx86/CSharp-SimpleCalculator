name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y mono-complete
      - name: Compile
        run: |
          mkdir -p SimpleCalc/bin
          mcs -warn:4 -out:SimpleCalc/bin/Calc.exe SimpleCalc/Program.cs
      - name: "Smoke test (1 + 2 = 3)"
        run: printf '1\n2\n+\nexit\n' | mono SimpleCalc/bin/Calc.exe | grep -q '^3$'
      - name: "Smoke test (div by zero guarded)"
        run: printf '1\n0\n/\nexit\n' | mono SimpleCalc/bin/Calc.exe | grep -q 'Cannot divide by zero'
      - name: "Smoke test (loop, two calculations then exit)"
        run: printf '1\n2\n+\n4\n5\n*\nexit\n' | mono SimpleCalc/bin/Calc.exe > out.txt && grep -q '^3$' out.txt && grep -q '^20$' out.txt
      - name: "Smoke test (NaN and Infinity rejected)"
        run: |
          printf 'NaN\n5\n+\nexit\n' | mono SimpleCalc/bin/Calc.exe > nan.txt
          grep -q 'Invalid number' nan.txt && ! grep -q '^NaN$' nan.txt
          printf 'Infinity\n5\n+\nexit\n' | mono SimpleCalc/bin/Calc.exe > inf.txt
          grep -q 'Invalid number' inf.txt && ! grep -q '^Infinity$' inf.txt
      - name: "Smoke test (EOF ends the session cleanly)"
        run: printf '1\n2\n+\n' | mono SimpleCalc/bin/Calc.exe > out.txt && grep -q '^3$' out.txt && grep -q 'No more input' out.txt
