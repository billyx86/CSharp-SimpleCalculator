name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y mono-complete
      - name: Compile
        run: |
          mkdir -p SimpleCalc/bin
          mcs -warn:4 -out:SimpleCalc/bin/Calc.exe SimpleCalc/Program.cs
      - name: "Smoke test (1 + 2 = 3)"
        run: printf '1\n2\n+\nexit\n' | mono SimpleCalc/bin/Calc.exe | grep -q '^3$'
      - name: "Smoke test (div by zero guarded)"
        run: printf '1\n0\n/\nexit\n' | mono SimpleCalc/bin/Calc.exe | grep -q 'Cannot divide by zero'
      - name: "Smoke test (loop, two calculations then exit)"
        run: printf '1\n2\n+\n4\n5\n*\nexit\n' | mono SimpleCalc/bin/Calc.exe > out.txt && grep -q '^3$' out.txt && grep -q '^20$' out.txt
      - name: "Smoke test (NaN and Infinity rejected)"
        run: |
          printf 'NaN\n5\n+\nexit\n' | mono SimpleCalc/bin/Calc.exe > nan.txt
          grep -q 'Invalid number' nan.txt && ! grep -q '^NaN$' nan.txt
          printf 'Infinity\n5\n+\nexit\n' | mono SimpleCalc/bin/Calc.exe > inf.txt
          grep -q 'Invalid number' inf.txt && ! grep -q '^Infinity$' inf.txt
      - name: "Smoke test (EOF ends the session cleanly)"
        run: printf '1\n2\n+\n' | mono SimpleCalc/bin/Calc.exe > out.txt && grep -q '^3$' out.txt && grep -q 'No more input' out.txt
      - name: "Smoke test (locale-independent decimal parse and print, #8)"
        run: |
          # Under de_DE the dot is a thousands separator, so '5.5' used to parse as 55.
          OUT=$(printf '5.5\n1\n+\nexit\n' | LANG=de_DE.UTF-8 LC_ALL=de_DE.UTF-8 mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q '^6.5$'
          # And the result prints with a dot, not a comma, under de_DE.
          OUT=$(printf '10\n4\n/\nexit\n' | LANG=de_DE.UTF-8 LC_ALL=de_DE.UTF-8 mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q '^2.5$'
          ! echo "$OUT" | grep -q '2,5'
      - name: "Smoke test (operator trimmed, exit case-insensitive, #10)"
        run: |
          # A stray space around the operator no longer counts as invalid input.
          OUT=$(printf '1\n2\n+ \nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q '^3$'
          # 'Exit' and ' EXIT ' end the session just like 'exit' (one prompt round each).
          OUT=$(printf '1\n2\nExit\n' | mono SimpleCalc/bin/Calc.exe)
          [ "$(echo "$OUT" | grep -c 'Enter your first number')" -eq 1 ]
          OUT=$(printf '1\n2\n EXIT \n' | mono SimpleCalc/bin/Calc.exe)
          [ "$(echo "$OUT" | grep -c 'Enter your first number')" -eq 1 ]
          # A genuinely invalid operator is still rejected. ('%' used to be the
          # test fixture here, but modulo is a real operator since #17.)
          OUT=$(printf '1\n2\n&\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'Invalid input'
      - name: "Smoke test (power ^, #17)"
        run: |
          # 2 ^ 10 = 1024
          OUT=$(printf '2\n10\n^\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q '^1024$'
          # 2 ^ 0.5 = sqrt(2), an irrational result that prints with a dot.
          OUT=$(printf '2\n0.5\n^\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q '^1.4142135623731$'
          # 1e308 ^ 2 overflows; it must be reported, not printed as Infinity.
          OUT=$(printf '1e308\n2\n^\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'Result overflowed'
          ! echo "$OUT" | grep -q '^Infinity$'
      - name: "Smoke test (modulo %, #17)"
        run: |
          # 10 % 4 = 2
          OUT=$(printf '10\n4\n%%\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q '^2$'
          # 9 % 2.5 = 1.5 (floating-point modulo)
          OUT=$(printf '9\n2.5\n%%\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q '^1.5$'
          # Modulo by zero is guarded, in the same style as division by zero.
          OUT=$(printf '1\n0\n%%\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'Cannot take the modulo of zero'
          ! echo "$OUT" | grep -q '^NaN$'
      - name: "Smoke test (history command, #19)"
        run: |
          # Two calculations (1+2=3, 4*5=20), then 'history' must list both, oldest first.
          OUT=$(printf '1\n2\n+\n4\n5\n*\n1\n1\nhistory\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'Recent results (oldest first):'
          # The two results appear in order after the header.
          echo "$OUT" | sed -n '/Recent results/,$p' | grep -q '^3$'
          echo "$OUT" | sed -n '/Recent results/,$p' | grep -q '^20$'
          # The history command is case-insensitive, like exit.
          OUT=$(printf '1\n2\n+\n7\n8\n*\n1\n1\nHISTORY\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'Recent results (oldest first):'
          # Only the last 3 results are kept: 4 calcs (3, 20, 6, 8) then history
          # must show 20, 6 and 8 — the oldest result (3) has dropped off.
          OUT=$(printf '1\n2\n+\n4\n5\n*\n7\n1\n-\n3\n5\n+\n1\n1\nhistory\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          HIST=$(echo "$OUT" | sed -n '/Recent results/,$p')
          echo "$HIST" | grep -q '^20$'
          echo "$HIST" | grep -q '^6$'
          echo "$HIST" | grep -q '^8$'
          ! echo "$HIST" | grep -q '^3$'
          # With no results yet, history says so and the session continues.
          OUT=$(printf '1\n2\nhistory\n3\n4\n+\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'No results yet.'
          echo "$OUT" | grep -q '^7$'
          # Failed operations (division by zero) are not recorded: 1+2=3 then
          # 1/0, then history must show only the 3.
          OUT=$(printf '1\n2\n+\n1\n0\n/\n1\n1\nhistory\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          HIST=$(echo "$OUT" | sed -n '/Recent results/,$p')
          echo "$HIST" | grep -q '^3$'
          [ "$(echo "$HIST" | grep -c '^[0-9.-]\+$')" -eq 1 ]
      - name: "Smoke test (overflow results reported, not Infinity, #14)"
        run: |
          # 1e308 * 10 overflows double.MaxValue; it must not print "Infinity".
          OUT=$(printf '1e308\n10\n*\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'Result overflowed'
          ! echo "$OUT" | grep -q '^Infinity$'
          # 1e308 + 1e308 overflows too.
          OUT=$(printf '1e308\n1e308\n+\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'Result overflowed'
          ! echo "$OUT" | grep -q '^Infinity$'
          # 1e308 - -1e308 overflows via subtraction.
          OUT=$(printf '1e308\n-1e308\n-\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          echo "$OUT" | grep -q 'Result overflowed'
          ! echo "$OUT" | grep -q '^Infinity$'
          # A still-finite large result (1e308, which is < MaxValue) is NOT flagged.
          OUT=$(printf '1\n1e-308\n/\nexit\n' | mono SimpleCalc/bin/Calc.exe)
          ! echo "$OUT" | grep -q 'Result overflowed'
      - name: "Guard (Program.cs stays minimal: no dead using directives, #13)"
        run: |
          # The exercise code is meant to teach C# basics with only the
          # directives a reader needs ('using System;' for Console/double and
          # 'using System.Globalization;' for CultureInfo). Fail if any of the
          # seven usings the original template shipped with reappear.
          for u in System.Collections.Generic System.IO System.Linq System.Runtime.CompilerServices System.Runtime.InteropServices System.Text System.Threading.Tasks; do
            if grep -q "using $u;" SimpleCalc/Program.cs; then
              echo "Unexpected 'using $u;' in SimpleCalc/Program.cs" >&2
              exit 1
            fi
          done
