name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y mono-complete
      - name: Compile
        run: |
          mkdir -p SimpleCalc/bin
          mcs -warn:4 -out:SimpleCalc/bin/Calc.exe SimpleCalc/Program.cs
      - name: Smoke test (1 + 2 = 3)
        run: printf '1\n2\n+\n\n' | mono SimpleCalc/bin/Calc.exe | grep -q '^3$'
      - name: Smoke test (div by zero guarded)
        run: printf '1\n0\n/\n\n' | mono SimpleCalc/bin/Calc.exe | grep -q 'Cannot divide by zero'
